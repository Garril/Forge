[project]
name = "cedric-video-captioner"
version = "0.1.0"
description = "Local video downloader and speech-to-subtitle tool"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "Cedric" }]
requires-python = ">=3.10,<3.14"
keywords = ["video", "bilibili", "yt-dlp", "ffmpeg", "asr", "srt"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp[default]>=2025.7.21",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "diskcache>=5.6.3",
    "platformdirs>=4.0.0",
    "requests>=2.31.0",
    "MetaTrader5>=5.0.45; platform_system == 'Windows'",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
cedric-captioner = "videocaptioner.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videocaptioner"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
